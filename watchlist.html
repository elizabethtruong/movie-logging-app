<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Watchlist — Movie Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="watchlist">

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <nav id="siteNav" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top border-bottom"></nav>

  <main id="main-content" class="container py-4">
    <div class="page-header-block"><h1 class="display-6 fw-bold">Watchlist</h1><p class="text-secondary mb-0">Find a film and save it to your list instantly.</p></div>
    <div class="row g-4">
      <div class="col-lg-7">
        <section aria-label="Search movies to add to watchlist">
          <div class="card card-soft p-4 mb-4">
            <h2 class="h4 mb-3">Search movies with OMDb</h2>
            <form id="watchSearchForm" class="row g-2">
              <div class="col"><input class="form-control" type="text" id="watchSearchInput" placeholder="Search by movie title..." aria-label="Search for a movie to add to your watchlist" required /></div>
              <div class="col-auto"><button class="btn btn-success" type="submit">Search</button></div>
            </form>
            <div id="watchSearchResults" class="vstack gap-3 mt-3"><div class="alert alert-light border mb-0">Search for a film to add it to your watchlist.</div></div>
          </div>
        </section>
      </div>
      <div class="col-lg-5"><div class="card card-soft p-4"><h2 class="h4 mb-3">Your watchlist</h2><div id="watchlistList" class="vstack gap-3"></div></div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  </body>
</html>
