<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log a Movie — Movie Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="log-movie">

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <nav id="siteNav" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top border-bottom"></nav>

  <main id="main-content" class="container py-4">
    <div class="page-header-block"><h1 class="display-6 fw-bold">Log a Movie</h1></div>
    <div class="row g-4">
      <div class="col-lg-7">
        <section aria-label="Search movies">
          <div class="card card-soft p-4 mb-4">
            <h2 class="h4 mb-3">Search movies with OMDb</h2>
            <form id="movieSearchForm" class="row g-2">
              <div class="col"><input class="form-control" type="text" id="movieSearchInput" placeholder="Search by movie title..." aria-label="Search for a movie by title" required /></div>
              <div class="col-auto"><button class="btn btn-success" type="submit">Search</button></div>
            </form>
            <div id="movieSearchResults" class="vstack gap-3 mt-3"><div class="alert alert-light border mb-0">Search for a movie to quickly fill in the log form.</div></div>
          </div>
        </section>
        <section aria-label="Log a movie">
          <div class="card card-soft p-4">
            <h2 class="h4 mb-3">Log a movie</h2>
            <form id="movieForm" class="vstack gap-3" aria-label="Log a movie">
              <input type="hidden" id="posterUrl" aria-hidden="true" />
              <input type="hidden" id="omdbId" aria-hidden="true" />
              <input type="hidden" id="movieYear" aria-hidden="true" />
              <div><label class="form-label" for="title">Movie title</label><input class="form-control" type="text" id="title" required /></div>
              <div class="row g-3">
                <div class="col-md-6"><label class="form-label" for="dateWatched">Date watched</label><input class="form-control" type="date" id="dateWatched" required /></div>
                <div class="col-md-6"><label class="form-label" for="rating">Rating</label><select class="form-select" id="rating" required><option value="">Select rating</option><option value="1">1/5</option><option value="2">2/5</option><option value="3">3/5</option><option value="4">4/5</option><option value="5">5/5</option></select></div>
              </div>
              <div><label class="form-label" for="review">Review</label><textarea class="form-control" id="review" rows="5" placeholder="Write your thoughts about the movie..."></textarea></div>
              <button class="btn btn-success" type="submit">Save Movie</button>
            </form>
          </div>
        </section>
      </div>
      <div class="col-lg-5"><div class="card card-soft p-4"><h2 class="h4 mb-3">Most recent movies logged</h2><div id="movieList" class="vstack gap-3"></div></div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  </body>
</html>
